version: "3.9"

# ── EUDR Guardian — Two-container stack ────────────────────────────────────────
#
# Container 1 (api):  Express + Hedera SDK + Anthropic  — host port 3001
# Container 2 (web):  Next.js standalone UI              — host port 3000
#
# Nginx (installed on host) sits in front and routes:
#   commerce-agent.zigotrace.com      → localhost:3000
#   api-commerce-agent.zigotrace.com  → localhost:3001
#
# Internal container-to-container traffic still uses the Docker network
# (INTERNAL_API_URL=http://api:3001) — the web container never hits the
# public API domain to talk to the api container.
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up --build -d
# ────────────────────────────────────────────────────────────────────────────────

services:

  # ── API container ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      NODE_ENV: production
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── UI container ──────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      NODE_ENV: production
      # Web container calls api container directly via Docker internal network.
      # Change this only if moving to separate VMs.
      INTERNAL_API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    name: eudr-guardian-network
